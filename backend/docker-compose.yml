services:
  mysql:
    image: mysql:8.4
    container_name: elearning-mysql
    environment:
      MYSQL_DATABASE: elearning
      MYSQL_USER: springuser
      MYSQL_PASSWORD: AvnEesh@3512
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build: .
    container_name: elearning-backend

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "8080:8080"

    env_file:
      - .env

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/elearning
      SPRING_DATASOURCE_USERNAME: springuser
      SPRING_DATASOURCE_PASSWORD: AvnEesh@3512

  frontend:
    build: ../frontend
    container_name: elearning-frontend

    depends_on:
      - backend

    ports:
      - "3000:80"
volumes:
  mysql_data: